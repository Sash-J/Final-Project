<!DOCTYPE html>
<html>
<head>
<style>
body { background: #0f172a; margin: 0; padding: 50px; }
.card { width: 300px; height: 100px; background: rgba(255,255,255,0.1); margin-bottom: 50px; border-radius: 10px; }
.left { margin-right: auto; margin-left: 20px; }
.right { margin-left: auto; margin-right: 20px; }
.container { position: relative; width: 800px; margin: 0 auto; }
</style>
</head>
<body>
<div class="container">
  <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;" viewBox="0 0 800 1000" preserveAspectRatio="none">
    <path d="M400,0 C400,50 600,50 600,100 C600,150 400,150 400,200 C400,250 200,250 200,300 C200,350 400,350 400,400" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />
  </svg>
  <div class="card right"></div>
  <div class="card left"></div>
  <div class="card right"></div>
</div>
</body>
</html>
