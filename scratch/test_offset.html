<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #222; }
  .container { position: relative; width: 600px; height: 600px; margin: 50px auto; background: #333; }
  svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  .dot {
    position: absolute;
    width: 20px;
    height: 20px;
    background: cyan;
    border-radius: 50%;
    offset-path: path('M 300 0 C 100 150, 500 450, 300 600');
    offset-rotate: 0deg;
    top: 0; left: 0;
    margin: -10px 0 0 -10px; /* center it */
    animation: move 3s infinite alternate ease-in-out;
  }
  @keyframes move {
    0% { offset-distance: 0%; }
    100% { offset-distance: 100%; }
  }
</style>
</head>
<body>
  <div class="container">
    <svg>
      <path d="M 300 0 C 100 150, 500 450, 300 600" stroke="white" stroke-width="2" fill="none" />
    </svg>
    <div class="dot"></div>
  </div>
</body>
</html>
